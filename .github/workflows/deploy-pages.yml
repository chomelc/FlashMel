name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config from secret
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -z "$CARTO_API_KEY" ]; then
            echo "::error::CARTO_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf "// Generated in CI — do not commit\nwindow.CARTO_API_KEY = '%s';\n" "$CARTO_API_KEY" > js/config.js

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data dist js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
